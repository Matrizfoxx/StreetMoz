<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetMoz - Loja Online</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0066ff;
            --primary-hover: #0052cc;
            --success: #25d366;
            --success-hover: #1da851;
            --danger: #ef4444;
            --dark: #0f172a;
            --light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
            --shadow-hover: 0 12px 25px -5px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--dark);
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .btn-admin-open {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.6rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-admin-open:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .cart-icon {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 500;
        }

        .cart-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.03);
        }

        .cart-badge {
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }

        .cart-badge.bump {
            animation: bump 0.3s ease;
        }

        /* HERO BANNER */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* CONTAINER PRINCIPAL */
        .container {
            max-width: 1200px;
            margin: 0 auto 3rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .btn-reset {
            background: none;
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
        }

        .btn-reset:hover {
            background: var(--border);
            color: var(--dark);
        }

        /* GRID DE PRODUTOS */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        /* CARTÃO DE PRODUTO */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease-in-out;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .btn-delete-product {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: var(--transition);
        }

        .btn-delete-product:hover {
            background: var(--danger);
            transform: scale(1.1);
        }

        .product-image {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #eee;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.08);
        }

        .product-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .product-description {
            font-size: 0.875rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 1.2rem;
            flex-grow: 1;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark);
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        /* MODAIS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: flex-end;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -5px 0 25px rgba(0,0,0,0.15);
        }

        .modal.open .modal-content {
            transform: translateX(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .modal-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem;
        }

        /* FORMULÁRIO ADMIN */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .btn-save-product {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: var(--transition);
        }

        .btn-save-product:hover {
            background-color: var(--primary-hover);
        }

        /* CARRINHO */
        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin: 1rem 0;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-img {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-details { flex-grow: 1; }
        .cart-item-details h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.2rem; }
        .cart-item-details span { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .cart-item-controls button {
            background: var(--light);
            border: 1px solid var(--border);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-remove {
            background: #fee2e2 !important;
            color: #ef4444 !important;
            border: none !important;
            margin-left: 0.4rem;
        }

        .cart-footer {
            border-top: 1px solid var(--border);
            padding-top: 1.2rem;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }

        .btn-checkout {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .btn-checkout:hover { background-color: var(--success-hover); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .navbar { padding: 1rem; }
            .hero { padding: 2rem 1rem; }
            .hero h1 { font-size: 1.6rem; }
            .product-grid { grid-template-columns: 1fr; }
            .modal-content { max-width: 100%; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-bag-shopping"></i> StreetMoz
        </div>
        <div class="nav-actions">
            <button class="btn-admin-open" id="open-admin-btn">
                <i class="fa-solid fa-plus"></i> Novo Produto
            </button>
            <div class="cart-icon" id="open-cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Produtos Exclusivos</h1>
        <p>Entregas rápidas com garantia de qualidade.</p>
    </section>

    <main class="container">
        <div class="section-header">
            <h2 class="section-title">Destaques da Semana</h2>
            <button class="btn-reset" onclick="resetDefaultProducts()">Restaurar Produtos Padrão</button>
        </div>
        <section class="product-grid" id="product-grid">
            <!-- Produtos renderizados aqui -->
        </section>
    </main>

    <!-- MODAL ADICIONAR PRODUTO -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Adicionar Novo Produto</h2>
                <button class="btn-close" id="close-admin-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-product-form" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input type="text" id="prod-name" placeholder="Ex: Óculos de Sol" required>
                </div>
                <div class="form-group">
                    <label>Preço (MT)</label>
                    <input type="number" id="prod-price" placeholder="Ex: 1200" required>
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="prod-desc" rows="3" placeholder="Detalhes do produto..." required></textarea>
                </div>
                <div class="form-group">
                    <label>URL da Imagem</label>
                    <input type="url" id="prod-img" placeholder="https://exemplo.com/imagem.jpg" required>
                </div>
                <button type="submit" class="btn-save-product">Guardar Produto</button>
            </form>
        </div>
    </div>

    <!-- MODAL CARRINHO -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seu Carrinho</h2>
                <button class="btn-close" id="close-cart-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cart-items" class="cart-items">
                <!-- Itens do carrinho -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total-price">0 MT</span>
                </div>
                <button id="checkout-btn" class="btn-checkout">
                    <i class="fa-brands fa-whatsapp"></i> Enviar Pedido via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        // Altera para o teu número real com o código de país (258)
        const WHATSAPP_PHONE = "258840000000"; 

        // Os 3 Produtos Padrão da Loja
        const initialProducts = [
            { 
                id: 1, 
                name: "Relógio Prata Minimalista", 
                price: 1500, 
                desc: "Design elegante com pulseira em aço inoxidável e caixa resistente à água.",
                img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" 
            },
            { 
                id: 2, 
                name: "Sapatilhas Urban Sport", 
                price: 3200, 
                desc: "Máximo conforto para uso diário com solado emborrachado de alta aderência.",
                img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" 
            },
            { 
                id: 3, 
                name: "Auscultadores Bluetooth", 
                price: 850, 
                desc: "Som de alta fidelidade com cancelamento de ruído e bateria até 20 horas.",
                img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" 
            }
        ];

        // Carregar do LocalStorage ou usar a lista inicial se estiver vazio
        let savedProducts = JSON.parse(localStorage.getItem('streetmoz_products'));
        let products = (savedProducts && savedProducts.length > 0) ? savedProducts : initialProducts;
        let cart = JSON.parse(localStorage.getItem('ecommerce_cart')) || [];

        // Referências DOM
        const productGrid = document.getElementById('product-grid');
        const cartModal = document.getElementById('cart-modal');
        const adminModal = document.getElementById('admin-modal');
        const openCartBtn = document.getElementById('open-cart-btn');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const openAdminBtn = document.getElementById('open-admin-btn');
        const closeAdminBtn = document.getElementById('close-admin-btn');
        const addProductForm = document.getElementById('add-product-form');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartCountElement = document.getElementById('cart-count');
        const cartTotalPriceElement = document.getElementById('cart-total-price');
        const checkoutBtn = document.getElementById('checkout-btn');

        // Renderizar Produtos
        function renderProducts() {
            if (products.length === 0) {
                productGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Nenhum produto disponível. Clica em "Novo Produto" ou "Restaurar Produtos Padrão".</p>';
                return;
            }

            productGrid.innerHTML = products.map(product => `
                <article class="product-card">
                    <button class="btn-delete-product" onclick="deleteProduct(${product.id})" title="Eliminar produto">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                <div class="product-image">
                        <img src="${product.img}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-description">${product.desc}</p>
                        <div class="product-bottom">
                            <span class="product-price">${product.price} MT</span>
                            <button class="btn-add" onclick="addToCart(${product.id}, '${product.name}', ${product.price}, '${product.img}')">
                                <i class="fa-solid fa-plus"></i> Adicionar
                            </button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        // Adicionar ao Carrinho
        function addToCart(id, name, price, img) {
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, name, price, img, quantity: 1 });
            }
            
            saveCart();
            updateCartUI();
            animateCartBadge();
        }

        // Eliminar Produto
        function deleteProduct(id) {
            if (confirm('Tem a certeza que pretende eliminar este produto?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('streetmoz_products', JSON.stringify(products));
                renderProducts();
            }
        }

        // Restaurar Produtos Padrão
        function resetDefaultProducts() {
            if (confirm('Isto irá repor todos os produtos para os padrões da loja. Continuar?')) {
                products = JSON.parse(JSON.stringify(initialProducts));
                localStorage.setItem('streetmoz_products', JSON.stringify(products));
                renderProducts();
            }
        }

        // Atualizar UI do Carrinho
        function updateCartUI() {
            cartCountElement.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Carrinho vazio</p>';
                cartTotalPriceElement.textContent = '0 MT';
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.img}" alt="${item.name}" class="cart-item-img">
                    <div class="cart-item-details">
                        <h4>${item.name}</h4>
                        <span>${item.price} MT × ${item.quantity}</span>
                    </div>
                    <div class="cart-item-controls">
                        <button onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                        <span style="width: 30px; text-align: center;">${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                        <button class="btn-remove" onclick="removeFromCart(${item.id})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotalPriceElement.textContent = `${total} MT`;
        }

        // Atualizar Quantidade
        function updateQuantity(id, newQuantity) {
            if (newQuantity <= 0) {
                removeFromCart(id);
            } else {
                const item = cart.find(i => i.id === id);
                if (item) {
                    item.quantity = newQuantity;
                    saveCart();
                    updateCartUI();
                }
            }
        }

        // Remover do Carrinho
        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            updateCartUI();
        }

        // Guardar Carrinho no LocalStorage
        function saveCart() {
            localStorage.setItem('ecommerce_cart', JSON.stringify(cart));
        }

        // Animar o Badge do Carrinho
        function animateCartBadge() {
            cartCountElement.classList.remove('bump');
            void cartCountElement.offsetWidth;
            cartCountElement.classList.add('bump');
        }

        // Abrir/Fechar Modais
        openCartBtn.addEventListener('click', () => {
            cartModal.classList.add('open');
            updateCartUI();
        });

        closeCartBtn.addEventListener('click', () => {
            cartModal.classList.remove('open');
        });

        openAdminBtn.addEventListener('click', () => {
            adminModal.classList.add('open');
        });

        closeAdminBtn.addEventListener('click', () => {
            adminModal.classList.remove('open');
        });

        // Fechar Modais ao Clicar Fora
        [cartModal, adminModal].forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('open');
            });
        });

        // Adicionar Novo Produto
        addProductForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newProduct = {
                id: products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1,
                name: document.getElementById('prod-name').value,
                price: parseFloat(document.getElementById('prod-price').value),
                desc: document.getElementById('prod-desc').value,
                img: document.getElementById('prod-img').value
            };

            products.push(newProduct);
            localStorage.setItem('streetmoz_products', JSON.stringify(products));
            renderProducts();
            
            addProductForm.reset();
            adminModal.classList.remove('open');
            alert('Produto adicionado com sucesso!');
        });

        // Enviar Pedido via WhatsApp
        checkoutBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                alert('Carrinho vazio!');
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const items = cart.map(item => `${item.quantity}x ${item.name} - ${item.price * item.quantity} MT`).join('\n');
            const message = `Olá! Queria fazer um pedido:\n\n${items}\n\n💰 Total: ${total} MT`;
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodedMessage}`, '_blank');
        });

        // Renderizar Produtos ao Carregar a Página
        renderProducts();
