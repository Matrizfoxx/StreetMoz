<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Online - Catálogo e Carrinho</title>
    
    <!-- ESTILOS CSS -->
    <style>
        /* Configurações Globais */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
        }

        /* Barra de Navegação */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a1a1a;
            color: #fff;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .cart-icon {
            font-size: 1rem;
            cursor: pointer;
            background-color: #333;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            user-select: none;
        }

        .cart-icon:hover {
            background-color: #444;
        }

        /* Contentor Principal */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        /* Grelha de Produtos Responsiva */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        /* Cartão do Produto */
        .product-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .product-description {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #008055;
        }

        .btn-add {
            background-color: #0066cc;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add:hover {
            background-color: #0052a3;
        }

        /* Modal do Carrinho */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: flex-end;
        }

        .cart-modal.open {
            display: flex;
        }

        .cart-content {
            background: #fff;
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 1rem;
        }

        #close-cart-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin: 1rem 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eee;
        }

        .cart-item-details h4 {
            font-size: 0.95rem;
        }

        .cart-item-details span {
            font-size: 0.85rem;
            color: #666;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .cart-item-controls button {
            background: #ddd;
            border: none;
            padding: 0.2rem 0.5rem;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }

        .btn-remove {
            background: #ff4d4d !important;
            color: white;
            margin-left: 0.5rem;
        }

        .cart-footer {
            border-top: 1px solid #ddd;
            padding-top: 1rem;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .btn-checkout {
            width: 100%;
            background-color: #008055;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-checkout:hover {
            background-color: #006644;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO DA LOJA -->
    <header class="navbar">
        <div class="logo">MinhaLoja</div>
        <div class="cart-icon">
            🛒 Carrinho (<span id="cart-count">0</span>)
        </div>
    </header>

    <!-- CORPO PRINCIPAL DO CATÁLOGO -->
    <main class="container">
        <h1>Produtos em Destaque</h1>
        <section class="product-grid" id="product-grid">
            <!-- Os produtos são inseridos aqui via JS -->
        </section>
    </main>

    <!-- PAINEL LATERAL DO CARRINHO (MODAL) -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>Seu Carrinho</h2>
                <button id="close-cart-btn">&times;</button>
            </div>
            <div id="cart-items" class="cart-items">
                <!-- Os itens do carrinho são inseridos aqui via JS -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total-price">0 MT</span>
                </div>
                <button id="checkout-btn" class="btn-checkout">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // Base de dados simulada dos produtos
        const products = [
            { id: 1, name: "Produto Exemplo 1", price: 1500, img: "https://via.placeholder.com/250" },
            { id: 2, name: "Produto Exemplo 2", price: 3200, img: "https://via.placeholder.com/250" },
            { id: 3, name: "Produto Exemplo 3", price: 850, img: "https://via.placeholder.com/250" }
        ];

        // Estado do Carrinho (Recupera do LocalStorage se existir)
        let cart = JSON.parse(localStorage.getItem('ecommerce_cart')) || [];

        // Elementos do DOM
        const cartIcon = document.querySelector('.cart-icon');
        const cartModal = document.getElementById('cart-modal');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartCountElement = document.getElementById('cart-count');
        const cartTotalPriceElement = document.getElementById('cart-total-price');
        const productGrid = document.getElementById('product-grid');

        // Inicialização do aplicativo
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();
        });

        // Renderizar Produtos Dinamicamente na Grelha
        function renderProducts() {
            productGrid.innerHTML = products.map(product => `
                <article class="product-card">
                    <div class="product-image">
                        <img src="${product.img}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <h2 class="product-title">${product.name}</h2>
                        <p class="product-description">Descrição curta do produto com detalhes essenciais.</p>
                        <div class="product-bottom">
                            <span class="product-price">${product.price.toLocaleString('pt-MZ')} MT</span>
                            <button class="btn-add" onclick="addToCart(${product.id})">Adicionar</button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        // Adicionar produto ao carrinho
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCart();
            updateCartUI();
        }

        // Alterar quantidade do item no carrinho
        function changeQuantity(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (!item) return;

            item.quantity += delta;

            if (item.quantity <= 0) {
                removeFromCart(productId);
            } else {
                saveCart();
                updateCartUI();
            }
        }

        // Remover item do carrinho
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            updateCartUI();
        }

        // Guardar no LocalStorage
        function saveCart() {
            localStorage.setItem('ecommerce_cart', JSON.stringify(cart));
        }

        // Atualizar Interface do Carrinho
        function updateCartUI() {
            const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
            cartCountElement.textContent = totalItems;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align:center; margin-top: 2rem;">O carrinho está vazio.</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-details">
                            <h4>${item.name}</h4>
                            <span>${item.price.toLocaleString('pt-MZ')} MT x ${item.quantity}</span>
                        </div>
                        <div class="cart-item-controls">
                            <button onclick="changeQuantity(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQuantity(${item.id}, 1)">+</button>
                            <button class="btn-remove" onclick="removeFromCart(${item.id})">&times;</button>
                        </div>
                    </div>
                `).join('');
            }

            const totalValue = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            cartTotalPriceElement.textContent = `${totalValue.toLocaleString('pt-MZ')} MT`;
        }

        // Eventos de Abrir/Fechar Modal
        cartIcon.addEventListener('click', () => cartModal.classList.add('open'));
        closeCartBtn.addEventListener('click', () => cartModal.classList.remove('open'));
        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) cartModal.classList.remove('open');
        });
    </script>
</body>
</html>
