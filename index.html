<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Online Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0066ff;
            --primary-hover: #0052cc;
            --success: #10b981;
            --dark: #0f172a;
            --light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
            --shadow-hover: 0 12px 25px -5px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--dark);
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cart-icon {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 500;
        }

        .cart-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.03);
        }

        .cart-badge {
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }

        .cart-badge.bump {
            animation: bump 0.3s ease;
        }

        /* BANNER DE BOAS-VINDAS */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* CONTAINER PRINCIPAL */
        .container {
            max-width: 1200px;
            margin: 0 auto 3rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        /* GRID DE PRODUTOS */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        /* CARTÃO DE PRODUTO */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease ease-in-out;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .product-image {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #eee;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.08);
        }

        .product-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .product-description {
            font-size: 0.875rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 1.2rem;
            flex-grow: 1;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark);
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        .btn-add:active {
            transform: scale(0.95);
        }

        /* MODAL CARRINHO */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: flex-end;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cart-modal.open {
            display: flex;
            opacity: 1;
        }

        .cart-content {
            background: #fff;
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -5px 0 25px rgba(0,0,0,0.15);
        }

        .cart-modal.open .cart-content {
            transform: translateX(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .cart-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        #close-cart-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem;
            transition: var(--transition);
        }

        #close-cart-btn:hover {
            color: var(--dark);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin: 1rem 0;
            padding-right: 0.3rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-img {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-details h4 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .cart-item-details span {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .cart-item-controls button {
            background: var(--light);
            border: 1px solid var(--border);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .cart-item-controls button:hover {
            background: #e2e8f0;
        }

        .btn-remove {
            background: #fee2e2 !important;
            color: #ef4444 !important;
            border: none !important;
            margin-left: 0.4rem;
        }

        .btn-remove:hover {
            background: #fca5a5 !important;
        }

        .cart-footer {
            border-top: 1px solid var(--border);
            padding-top: 1.2rem;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }

        .btn-checkout {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-checkout:hover {
            background-color: #059669;
        }

        /* ANIMAÇÕES */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* RESPONSIVIDADE (MOBILE) */
        @media (max-width: 600px) {
            .navbar { padding: 1rem; }
            .hero { padding: 2rem 1rem; }
            .hero h1 { font-size: 1.6rem; }
            .product-grid { grid-template-columns: 1fr; }
            .cart-content { max-width: 100%; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-store"></i> StreetMoz
        </div>
        <div class="cart-icon" id="open-cart-btn">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Carrinho</span>
            <span class="cart-badge" id="cart-count">0</span>
        </div>
    </header>

    <section class="hero">
        <h1>Produtos Exclusivos</h1>
        <p>Entregas rápidas com garantia de qualidade.</p>
    </section>

    <main class="container">
        <h2 class="section-title">Destaques da Semana</h2>
        <section class="product-grid" id="product-grid">
            </section>
    </main>

    <div id="cart-modal" class="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>Seu Carrinho</h2>
                <button id="close-cart-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cart-items" class="cart-items">
                </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total-price">0 MT</span>
                </div>
                <button id="checkout-btn" class="btn-checkout">
                    <i class="fa-brands fa-whatsapp"></i> Finalizar Compra
                </button>
            </div>
        </div>
    </div>

    <script>
        // Base de Dados com Imagens Reais (Unsplash CDN)
        const products = [
            { 
                id: 1, 
                name: "Relógio Prata Minimalista", 
                price: 1500, 
                desc: "Design elegante com pulseira em aço inoxidável e caixa resistente à água.",
                img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" 
            },
            { 
                id: 2, 
                name: "Sapatilhas Urban Sport", 
                price: 3200, 
                desc: "Máximo conforto para uso diário com solado emborrachado de alta aderência.",
                img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" 
            },
            { 
                id: 3, 
                name: "Auscultadores Bluetooth", 
                price: 850, 
                desc: "Som de alta fidelidade com cancelamento de ruído e bateria até 20 horas.",
                img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" 
            }
        ];

        // Estado do Carrinho (Recupera do LocalStorage)
        let cart = JSON.parse(localStorage.getItem('ecommerce_cart')) || [];

        // Elementos do DOM
        const productGrid = document.getElementById('product-grid');
        const cartModal = document.getElementById('cart-modal');
        const openCartBtn = document.getElementById('open-cart-btn');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartCountElement = document.getElementById('cart-count');
        const cartTotalPriceElement = document.getElementById('cart-total-price');

        // Renderizar catálogo
        function renderProducts() {
            productGrid.innerHTML = products.map(product => `
                <article class="product-card">
                    <div class="product-image">
                        <img src="${product.img}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-description">${product.desc}</p>
                        <div class="product-bottom">
                            <span class="product-price">${product.price.toLocaleString('pt-MZ')} MT</span>
                            <button class="btn-add" data-id="${product.id}">
                                <i class="fa-solid fa-plus"></i> Adicionar
                            </button>
                        </div>
                    </div>
                </article>
            `).join('');

            // Atribuir ouvintes aos botões de adicionar
            document.querySelectorAll('.btn-add').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.currentTarget.getAttribute('data-id'));
                    addToCart(id);
                });
            });
        }

        // Adicionar ao carrinho
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCart();
            updateCartUI();
            triggerBadgeAnimation();
        }

        // Alterar quantidade
        function changeQuantity(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (!item) return;

            item.quantity += delta;

            if (item.quantity <= 0) {
                removeFromCart(productId);
            } else {
                saveCart();
                updateCartUI();
            }
        }

        // Remover item
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            updateCartUI();
        }

        // Persistence
        function saveCart() {
            localStorage.setItem('ecommerce_cart', JSON.stringify(cart));
        }

        // Atualizar Interface
        function updateCartUI() {
            const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
            cartCountElement.textContent = totalItems;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top: 3rem;">O seu carrinho está vazio.</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.img}" alt="${item.name}" class="cart-item-img">
                        <div class="cart-item-details">
                            <h4>${item.name}</h4>
                            <span>${item.price.toLocaleString('pt-MZ')} MT x ${item.quantity}</span>
                        </div>
                        <div class="cart-item-controls">
                            <button onclick="changeQuantity(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQuantity(${item.id}, 1)">+</button>
                            <button class="btn-remove" onclick="removeFromCart(${item.id})">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            const totalValue = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            cartTotalPriceElement.textContent = `${totalValue.toLocaleString('pt-MZ')} MT`;
        }

        // Animação de contador no badge
        function triggerBadgeAnimation() {
            cartCountElement.classList.add('bump');
            setTimeout(() => cartCountElement.classList.remove('bump'), 300);
        }

        // Controladores do Modal
        openCartBtn.addEventListener('click', () => cartModal.classList.add('open'));
        closeCartBtn.addEventListener('click', () => cartModal.classList.remove('open'));
        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) cartModal.classList.remove('open');
        });

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();
        });
    </script>
</body>
</html>
